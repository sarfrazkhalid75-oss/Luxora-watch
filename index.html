<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxora Watches</title>
<style>
.product button {
  background: #d4af37;
  color: black;
  border: none;
  padding: 10px 25px;
  border-radius: 8px;
}

@media (max-width: 600px) {
  .products {
    grid-template-columns: 1fr;
  }
  }
</style>
</head>

<body>
<div id="login-page">
<div class="login-box">

  <div class="logo">⌚ Luxora Watches</div>
  <p>Premium Watches</p>

  <h2>Login</h2>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button onclick="showProducts()">Login</button>
  <button>Register</button>
  <button>Continue with Google</button>

 </div>
 </div>
<div class="products" id="products" style="display:none;">

  <div class="product">
    <img src="IMG_20261007_112648.jpg?v=2" class="watch">
    <h3>Luxora Classic</h3>
    <p>Premium Luxury Watch</p>
    <h4>Rs. 4,999</h4>
    <button>Buy Now</button>
  </div>

  <div class="product">
    <img src="IMG_20261007_112707.jpg" class="watch">
    <h3>Luxora Gold</h3>
    <p>Elegant Gold Watch</p>
    <h4>Rs. 6,999</h4>
    <button>Buy Now</button>
  </div>

  <div class="product">
    <img src="IMG_20261007_112728.jpg" class="watch">
    <h3>Luxora Black</h3>
    <p>Classic Black Watch</p>
    <h4>Rs. 5,999</h4>
    <button>Buy Now</button>
  </div>

</div>

  <div class="product">
    <img src="IMG_20261007_112803.jpg" class="watch-img">
    <h3>Luxora Blue</h3>
    <p>Premium Blue Dial</p>
    <h4>Rs. 6,499</h4>
    <button>Buy Now</button>
  </div>

</div>

</body>

</html>
