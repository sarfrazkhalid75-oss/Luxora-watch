<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxora Watches</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
}

.login-box {
  width: 90%;
  max-width: 590px;
  padding: 45px 55px;
  background: #080808;
  border: 2px solid #8f7420;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 0 35px rgba(212,175,55,0.12);
}

.logo {
  font-size: 70px;
  font-weight: bold;
  color: #d4af37;
  line-height: 1.05;
  margin-bottom: 15px;
}

.login-box > p {
  font-size: 25px;
  margin-bottom: 25px;
}

.login-box h2 {
  font-size: 48px;
  margin-bottom: 35px;
}

.login-box input {
  width: 100%;
  padding: 20px;
  margin-bottom: 20px;
  border: none;
  border-radius: 15px;
  font-size: 20px;
  background: white;
  color: black;
}

.login-box button {
  width: 100%;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 15px;
  font-size: 20px;
  cursor: pointer;
}

.login-box button:first-of-type {
  background: #d4af37;
  color: black;
  border: none;
  font-weight: bold;
}

.login-box button:nth-of-type(2),
.login-box button:nth-of-type(3) {
  background: transparent;
  color: white;
  border: 2px solid #d4af37;
}

@media (max-width: 600px) {
  .login-box {
    width: 92%;
    padding: 35px 28px;
  }

  .logo {
    font-size: 45px;
  }

  .login-box > p {
    font-size: 20px;
  }

  .login-box h2 {
    font-size: 38px;
  }
}
</style>
</head>

<body>
<div id="login-page">
<div class="login-box">

  <div class="logo">⌚ Luxora Watches</div>
  <p>Premium Watches</p>

  <h2>Login</h2>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button onclick="showProducts()">Login</button>
  <button>Register</button>
  <button>Continue with Google</button>

 </div>
 </div>
<div class="products" id="products" style="display:none;">

  <div class="product">
    <img src="IMG_20261007_112648.jpg?v=2" class="watch">
    <h3>Luxora Classic</h3>
    <p>Premium Luxury Watch</p>
    <h4>Rs. 4,999</h4>
    <button>Buy Now</button>
  </div>

  <div class="product">
    <img src="IMG_20261007_112707.jpg" class="watch">
    <h3>Luxora Gold</h3>
    <p>Elegant Gold Watch</p>
    <h4>Rs. 6,999</h4>
    <button>Buy Now</button>
  </div>

  <div class="product">
    <img src="IMG_20261007_112728.jpg" class="watch">
    <h3>Luxora Black</h3>
    <p>Classic Black Watch</p>
    <h4>Rs. 5,999</h4>
    <button>Buy Now</button>
  </div>

</div>

  <div class="product">
    <img src="IMG_20261007_112803.jpg" class="watch-img">
    <h3>Luxora Blue</h3>
    <p>Premium Blue Dial</p>
    <h4>Rs. 6,499</h4>
    <button>Buy Now</button>
  </div>

</div>

</body>

</html>
